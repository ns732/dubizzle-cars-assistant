[project]
name = "dubizzle-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ns732", email = "beunique342@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.2",
    "google-genai>=1.20.0",
    "litellm>=1.108.3",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.9.1",
    "streamlit>=1.67.0",
    "tenacity>=9.2.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
dubizzle-assistant = "dubizzle_assistant:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
